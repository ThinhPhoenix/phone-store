<div class="thinh-container">

      <p class="thinh-subtitle">Welcome to your personal space</p>
    </div>
    
    <div class="thinh-content">
      <div class="thinh-avatar">
        <span class="avatar-text">T</span>
      </div>
      
      <div class="thinh-info">
        <div class="info-item">
          <span class="info-label">Status</span>

        <div class="info-item">
          <span class="info-label">Member Since</span>

      <button class="btn btn-secondary">Settings</button>
